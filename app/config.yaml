# Signal mapping: translates the last path segment of an incoming MQTT topic
# (e.g. xpeng/soc -> "soc") into a canonical field name + unit + optional
# scale factor. Add rows here as you discover/configure more PIDs on the
# WiCAN Automate tab (Send_to = "<SIGNAL_TOPIC_PREFIX>/<key below>").
#
# WiCAN's Xpeng G6 built-in vehicle profile (per meatpiHQ/wican-fw community
# reports) covers: soc, soh, hv_voltage, odometer. hv_current / charging /
# range are NOT confirmed for the G6 - add them once you've verified the PID
# yourself (see README "Finding more PIDs").
signals:
  soc:
    field: soc
    unit: "%"
  soh:
    field: soh
    unit: "%"
  hv_voltage:
    field: hvVoltage
    unit: "V"
  hv_current:
    field: hvCurrent
    unit: "A"
  odometer:
    field: odometerKm
    unit: "km"
  range:
    field: rangeKm
    unit: "km"
  charging:
    field: chargingRaw
    unit: "bool"

# Threshold above which derived charge power (kW) is considered "charging"
# when no explicit `charging` signal is being published.
chargingPowerThresholdKw: 0.2

# Static, does not come off the CAN bus - set to your actual trim's usable
# capacity (XPeng G6 is available in ~66 kWh and ~87.5 kWh usable pack sizes
# depending on market/trim - verify against your own vehicle spec sheet).
batteryCapacityKwh: 87.5
